name: Demo build and Pages deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the tested demo to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
      # setup-bazel installs the pinned Bazelisk launcher as `bazel`.
      - run: bazel test --lockfile_mode=error //...
      - run: bazel build --lockfile_mode=error //:pages //:standalone //:evaluation
      - name: Browser smoke test at project subpath and standalone
        run: bazel test --lockfile_mode=error //:browser_test --test_env=CHROME_BIN=/usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bazel-bin/demo.pages

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
